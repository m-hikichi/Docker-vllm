services:
  vllm:
    image: vllm/vllm-openai:v0.21.0
    container_name: vllm
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    volumes:
      - ./models:/models
    command: >
      --host 0.0.0.0
      --port 8000
      --model /models/Qwen3-1.7B
      --dtype auto
      --max-model-len 4096
      --served-model-name Qwen3-1.7B
      --api-key sk-local-CHANGE_ME
      --gpu-memory-utilization 0.7
